[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-generator"
version = "0.1.0"
description = "Statically generated catalog page for internal web apps"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "PyYAML",
    "Jinja2",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools]
packages = ["catalog_generator", "catalog_generator.sources"]

[tool.pytest.ini_options]
addopts = '-m "not e2e"'
markers = [
    "e2e: browser end-to-end tests (run with `pytest -m e2e`)",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
